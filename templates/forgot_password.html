{% extends "auth_base.html" %}

{% block title %}Forgot Password - StegoSecure{% endblock %}

{% block content %}

<div class="auth-heading">

    <h2>Reset Password</h2>

    <p>
        Enter your registered username and email
        to reset your password.
    </p>

</div>

<form
    method="POST"
    action="{{ url_for('forgot_password') }}"
    novalidate
>

    <label class="field-label" for="usernameInput">
        &#128100; Username
    </label>

    <input
        type="text"
        name="username"
        id="usernameInput"
        class="input"
        placeholder="Enter your username"
        autocomplete="username"
        value="{{ username or '' }}"
    >

    <label class="field-label" for="emailInput">
        &#128231; Registered Email
    </label>

    <input
        type="email"
        name="email"
        id="emailInput"
        class="input"
        placeholder="Enter your registered email"
        autocomplete="email"
        value="{{ email or '' }}"
    >

    <label class="field-label" for="newPasswordInput">
        &#128273; New Password
    </label>

    <div class="key-field">

        <input
            type="password"
            name="new_password"
            id="newPasswordInput"
            class="input"
            placeholder="Enter new password"
            autocomplete="new-password"
        >

        <button
            type="button"
            class="key-toggle"
            data-target="newPasswordInput"
            aria-label="Show or hide password"
        >
            &#128065;
        </button>

    </div>

    <label class="field-label" for="confirmPasswordInput">
        &#128273; Confirm New Password
    </label>

    <div class="key-field">

        <input
            type="password"
            name="confirm_password"
            id="confirmPasswordInput"
            class="input"
            placeholder="Confirm new password"
            autocomplete="new-password"
        >

        <button
            type="button"
            class="key-toggle"
            data-target="confirmPasswordInput"
            aria-label="Show or hide password"
        >
            &#128065;
        </button>

    </div>

    <button
        type="submit"
        class="btn btn-primary btn-block"
    >
        &#128273; Reset Password
    </button>

</form>

<p class="auth-switch">

    Remember your password?

    <a href="{{ url_for('login') }}">
        Back to Login
    </a>

</p>

{% endblock %}
