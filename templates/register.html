{% extends "auth_base.html" %}
{% block title %}Register - StegoSecure{% endblock %}

{% block content %}
<div class="auth-heading">
    <h2>Create Your StegoSecure Account</h2>
    <p>Join StegoSecure to protect your messages</p>
</div>

<form method="POST" action="{{ url_for('register') }}" id="registerForm" novalidate>
    <label class="field-label" for="fullNameInput">&#128100; Full Name</label>
    <input type="text" name="full_name" id="fullNameInput" class="input"
           placeholder="Enter your full name" autocomplete="name" value="{{ full_name or '' }}">

    <label class="field-label" for="usernameInput">&#128100; Username</label>
    <input type="text" name="username" id="usernameInput" class="input"
           placeholder="Choose a username (3-30 characters)" autocomplete="username" value="{{ username or '' }}">

    <label class="field-label" for="emailInput">&#9993; Email</label>
    <input type="email" name="email" id="emailInput" class="input"
           placeholder="Enter your email" autocomplete="email" value="{{ email or '' }}">

    <label class="field-label" for="passwordInput">&#128273; Password</label>
    <div class="key-field">
        <input type="password" name="password" id="passwordInput" class="input"
               placeholder="At least 6 characters" autocomplete="new-password">
        <button type="button" class="key-toggle" data-target="passwordInput" aria-label="Show or hide password">&#128065;</button>
    </div>

    <label class="field-label" for="confirmInput">&#128273; Confirm Password</label>
    <div class="key-field">
        <input type="password" name="confirm" id="confirmInput" class="input"
               placeholder="Re-enter your password" autocomplete="new-password">
        <button type="button" class="key-toggle" data-target="confirmInput" aria-label="Show or hide password">&#128065;</button>
    </div>

    <button type="submit" class="btn btn-primary btn-block">&#128100; Create Account</button>
</form>

<p class="auth-switch">Already have an account? <a href="{{ url_for('login') }}">Login</a></p>
{% endblock %}
