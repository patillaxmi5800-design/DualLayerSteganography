{% extends "auth_base.html" %}

{% block title %}Login - StegoSecure{% endblock %}

{% block content %}

<div class="auth-heading">
    <h2>Welcome Back</h2>
    <p>Sign in to continue</p>
</div>

<form method="POST"
      action="{{ url_for('login') }}"
      id="loginForm"
      novalidate>

    <label class="field-label" for="identifierInput">
        👤 Username or Email
    </label>

    <input
        type="text"
        name="identifier"
        id="identifierInput"
        class="input"
        placeholder="Enter your username or email"
        autocomplete="username"
        value="{{ identifier or '' }}"
        required
    >

    <label class="field-label" for="passwordInput">
        🔑 Password
    </label>

    <div class="key-field">

        <input
            type="password"
            name="password"
            id="passwordInput"
            class="input"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
        >

        <button
            type="button"
            class="key-toggle"
            data-target="passwordInput"
            aria-label="Show or hide password">
            👁
        </button>

    </div>

    <!-- FORGOT PASSWORD -->
    <div class="forgot-password">
        <a href="{{ url_for('forgot_password') }}">
            Forgot Password?
        </a>
    </div>

    <button type="submit" class="btn btn-primary btn-block">
        🔒 Login
    </button>

</form>

<p class="auth-switch">
    Don't have an account?
    <a href="{{ url_for('register') }}">Create Account</a>
</p>

{% endblock %}
